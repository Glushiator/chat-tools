<!DOCTYPE html>
<html lang="en">
<head>
  <title>AI Geo-Timestamp</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0066cc">
  <link rel="apple-touch-icon" sizes="256x256" href="icon-256.png">
  <link rel="icon" href="icon-256.png">
  <link rel="stylesheet" href="./cdn.jsdelivr.net/npm/@mdi/font@5.8.55/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="./use.fontawesome.com/releases/v5.2.0/css/all.css">
  <link rel="stylesheet" href="./cdn.jsdelivr.net/npm/buefy@1/dist/buefy.min.css">
  <style>
    body { padding: 1rem; }
    #app { max-width: 600px; margin: auto; }
    .hidden { visibility: hidden; }
    pre { white-space: pre-wrap; }

    /* Global status line, shown above the tabs */
    .status-box { margin-bottom: 1rem; padding: 0.75rem 1rem; }
    .status-line { margin: 0; white-space: pre-wrap; word-break: break-word; }

    /* Dark mode styles */
    .has-background-dark {
      background-color: #363636 !important;
      color: #f5f5f5;
    }
    .has-background-dark .box {
      background-color: #2b2b2b;
      color: #f5f5f5;
    }
    .has-background-dark .tabs {
      background-color: transparent;
    }
    .has-background-dark .tabs li a {
      color: #dbdbdb;
      border-bottom-color: #4a4a4a;
      background-color: transparent;
    }
    .has-background-dark .tabs li.is-active a {
      color: #f5f5f5;
      border-bottom-color: #3273dc;
      background-color: #2b2b2b;
    }
    .has-background-dark .tabs.is-toggle li.is-active a {
      background-color: #2b2b2b;
      border-color: #3273dc;
      color: #f5f5f5;
    }
    .has-background-dark .tabs.is-boxed li.is-active a {
      background-color: #2b2b2b;
      border-color: #4a4a4a;
      border-bottom-color: transparent;
      color: #f5f5f5;
    }
    .has-background-dark .tabs li a:hover {
      color: #ffffff;
      border-bottom-color: #b5b5b5;
      background-color: #363636;
    }
    .has-background-dark .tabs li a:focus {
      color: #ffffff;
      border-bottom-color: #3273dc;
      background-color: #363636;
      outline: none;
      box-shadow: 0 0 0 2px rgba(50, 115, 220, 0.5);
    }
    .has-background-dark .tabs li.is-active a:focus {
      color: #f5f5f5;
      border-bottom-color: #3273dc;
      background-color: #2b2b2b;
      box-shadow: 0 0 0 2px rgba(50, 115, 220, 0.5);
    }
    .has-background-dark .tabs a .icon {
      color: inherit;
    }
    .has-background-dark .title {
      color: #f5f5f5;
    }
    .has-background-dark .label {
      color: #f5f5f5;
    }
    .has-background-dark .input {
      background-color: #363636;
      border-color: #4a4a4a;
      color: #f5f5f5;
    }
    .has-background-dark .input:focus {
      border-color: #3273dc;
    }
    .has-background-dark .table {
      background-color: #2b2b2b;
      color: #f5f5f5;
    }
    .has-background-dark .table th {
      color: #f5f5f5;
      border-color: #4a4a4a;
      background-color: #363636;
    }
    .has-background-dark .table td {
      border-color: #4a4a4a;
      color: #f5f5f5;
      background-color: #2b2b2b;
    }
    .has-background-dark .table tr:hover {
      background-color: #363636;
    }
    .has-background-dark .table thead th {
      color: #f5f5f5;
      border-color: #4a4a4a;
    }
    .has-background-dark .table tbody tr {
      background-color: #2b2b2b;
    }
    .has-background-dark .table tbody tr:hover {
      background-color: #363636;
    }
    .has-background-dark .button {
      background-color: #363636;
      border-color: #4a4a4a;
      color: #f5f5f5;
    }
    .has-background-dark .button:hover {
      background-color: #4a4a4a;
      border-color: #5a5a5a;
    }
    .has-background-dark .button.is-primary {
      background-color: #3273dc;
      border-color: #3273dc;
      color: #fff;
    }
    .has-background-dark .button.is-primary:hover {
      background-color: #2366d1;
      border-color: #2366d1;
    }
    .has-background-dark .button.is-success {
      background-color: #48c774;
      border-color: #48c774;
      color: #fff;
    }
    .has-background-dark .button.is-success:hover {
      background-color: #3abb67;
      border-color: #3abb67;
    }
    .has-background-dark .button.is-link {
      background-color: #3273dc;
      border-color: #3273dc;
      color: #fff;
    }
    .has-background-dark .button.is-link:hover {
      background-color: #2366d1;
      border-color: #2366d1;
    }
    .has-background-dark .button.is-warning {
      background-color: #ffdd57;
      border-color: #ffdd57;
      color: rgba(0, 0, 0, 0.7);
    }
    .has-background-dark .button.is-warning:hover {
      background-color: #ffd83d;
      border-color: #ffd83d;
    }
    .has-background-dark .button.is-danger {
      background-color: #f14668;
      border-color: #f14668;
      color: #fff;
    }
    .has-background-dark .button.is-danger:hover {
      background-color: #ef2e55;
      border-color: #ef2e55;
    }
    .has-background-dark .button.is-info {
      background-color: #3298dc;
      border-color: #3298dc;
      color: #fff;
    }
    .has-background-dark .button.is-info:hover {
      background-color: #2793da;
      border-color: #2793da;
    }
    .has-background-dark hr {
      background-color: #4a4a4a;
    }
    .has-background-dark p {
      color: #f5f5f5;
    }
    .has-background-dark .has-text-grey {
      color: #b5b5b5 !important;
    }
    .has-background-dark .switch input[type="checkbox"] + .check {
      border-color: #7a7a7a;
    }
  </style>
</head>
<body>
  <div id="app" class="hidden">
    <tools-app></tools-app>
  </div>

  <template id="tools-app-template">
    <section class="box status-box">
      <p class="status-line" v-text="status"></p>
    </section>

    <b-tabs v-model="activeTab" type="is-boxed" expanded>
      <b-tab-item label="Copy" icon="content-copy">
        <section class="box">
          <b-button type="is-primary" @click="copyInfo(false)" expanded
            :loading="busy" :disabled="busy"
            label="Copy Timestamp &amp; Location"></b-button>
          <b-button type="is-link" class="mt-2" @click="copyInfo(true)" expanded
            :loading="busy" :disabled="busy"
            label="Copy Walk Position (10 m)"></b-button>
          <p class="mt-3 has-text-grey is-size-7">
            Walk mode always reverse-geocodes to a street address, ignoring saved
            locations. It re-geocodes whenever you move more than 10 m and appends
            the exact coordinates.
          </p>
        </section>
      </b-tab-item>

      <b-tab-item label="Locations" icon="map-marker">
        <section class="box">
          <h3 class="title is-5">Saved Locations</h3>
          <b-field label="Label">
            <b-input v-model="label" placeholder="Enter label" @keyup.enter="saveLocation"></b-input>
          </b-field>
          <b-button type="is-success" @click="saveLocation" expanded class="mb-2"
            :loading="savingLocation" :disabled="savingLocation">Save Current Location</b-button>
          <div class="buttons">
            <b-button type="is-link" @click="exportLocations">Export</b-button>
            <b-button type="is-warning" @click="triggerImport">Import</b-button>
            <input type="file" ref="importFile" @change="handleImport" accept="application/json" style="display:none">
          </div>
          <p class="has-text-grey is-size-7">Import merges into the list; entries with the same label are updated.</p>

          <hr>

          <p v-if="!savedLocations.length" class="has-text-centered">No locations saved yet.</p>
          <b-table v-else :data="savedLocations">
            <b-table-column field="label" label="Label" v-slot="props">
              {{ props.row.label }}
            </b-table-column>
            <b-table-column field="coords.lat" label="Lat" v-slot="props">
              {{ props.row.coords.lat }}
            </b-table-column>
            <b-table-column field="coords.lon" label="Lon" v-slot="props">
              {{ props.row.coords.lon }}
            </b-table-column>
            <b-table-column label="" v-slot="props">
              <b-button type="is-danger" size="is-small" icon-left="delete"
                @click="removeLocation(props.index)"></b-button>
            </b-table-column>
          </b-table>
        </section>
      </b-tab-item>

      <b-tab-item label="Settings" icon="cog">
        <section class="box">
          <h3 class="title is-5">Appearance</h3>
          <b-field label="Dark mode" horizontal>
            <b-switch v-model="darkMode"></b-switch>
          </b-field>

          <hr>

          <h3 class="title is-5">App Updates</h3>
          <b-button type="is-info" @click="checkForUpdates" expanded icon-left="refresh"
            :loading="checkingUpdate" :disabled="checkingUpdate">Check for Updates</b-button>
          <p class="mt-2 has-text-grey is-size-7">Version: {{ cacheVersion }}</p>
        </section>
      </b-tab-item>
    </b-tabs>
  </template>

  <script src="./unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="./cdn.jsdelivr.net/npm/buefy@1/dist/buefy.min.js"></script>
  <script src="index.js"></script>
  <script>

  const STORAGE_KEY = 'savedLocations'
  const READY_STATUS = 'Ready. Use the Copy tab to put a geo-timestamp on the clipboard.'

  // Ask the controlling worker what it actually runs, rather than guessing from
  // caches.keys() - during an update two caches coexist and find() picks either.
  function askServiceWorkerVersion(timeout = 2000) {
    return new Promise((resolve) => {
      const worker = navigator.serviceWorker && navigator.serviceWorker.controller
      if (!worker) {
        resolve(null)
        return
      }
      const channel = new MessageChannel()
      const timer = setTimeout(() => resolve(null), timeout)
      channel.port1.onmessage = (event) => {
        clearTimeout(timer)
        resolve(event.data && event.data.version || null)
      }
      worker.postMessage({ type: 'GET_VERSION' }, [channel.port2])
    })
  }

  // Resolves once the worker has finished installing and is ready to be promoted.
  function whenInstalled(worker) {
    return new Promise((resolve, reject) => {
      const settle = () => {
        if (worker.state === 'installed' || worker.state === 'activated' || worker.state === 'activating')
          resolve()
        else if (worker.state === 'redundant')
          reject(new Error('The update failed to install.'))
      }
      settle()
      worker.addEventListener('statechange', settle)
    })
  }

  const app = Vue.createApp({})
  app.use(Buefy.default)
  app.component('tools-app', {
    template: '#tools-app-template',
    data() {
      return {
        label: '',
        savedLocations: [],
        darkMode: false,
        status: READY_STATUS,
        activeTab: 0,
        cacheVersion: 'unknown',
        busy: false,
        savingLocation: false,
        checkingUpdate: false,
      }
    },
    mounted() {
      this.loadSaved()
      this.loadCacheVersion()
      this.darkMode = localStorage.getItem('darkMode') === 'true'
      if (this.darkMode) document.documentElement.classList.add('has-background-dark')
      document.getElementById("app").classList.remove("hidden")
    },
    watch: {
      darkMode(val) {
        localStorage.setItem('darkMode', val)
        document.documentElement.classList.toggle('has-background-dark', val)
      }
    },
    methods: {
      loadSaved() {
        let stored = null
        try {
          stored = JSON.parse(localStorage.getItem(STORAGE_KEY))
        } catch (e) {
          // A corrupt value used to throw out of mounted() and leave the whole
          // app half-initialised.
          console.error('Saved locations are unreadable:', e)
          this.status = 'Saved locations could not be read and were ignored.'
        }
        this.savedLocations = Array.isArray(stored)
          ? stored.map(normalizeLocation).filter(Boolean)
          : []
      },
      async loadCacheVersion() {
        try {
          const version = await askServiceWorkerVersion()
          if (version) {
            this.cacheVersion = version
            return
          }
          const keys = await caches.keys()
          const cacheKey = keys.find(k => k.startsWith('geo-timestamp-cache-'))
          if (cacheKey) {
            this.cacheVersion = cacheKey.replace('geo-timestamp-cache-', '')
          }
        } catch (e) {
          console.error('Could not get cache version:', e)
        }
      },
      saveToStore() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.savedLocations))
      },
      updateStatus(text) {
        this.status = text;
      },
      async copyInfo(walkMode = false) {
        if (this.busy) return
        this.busy = true
        const clipboardWriter = new ClipboardWriter()
        try {
          // Step 1: Get position
          this.updateStatus(walkMode ? 'Getting precise location...' : 'Getting location...')
          let pos
          try {
            pos = await getPosition(walkMode ? PRECISE_POSITION_OPTIONS : POSITION_OPTIONS)
          } catch (e) {
            console.error('Geolocation error:', e)
            await clipboardWriter.cancel()
            this.updateStatus('Error: Could not get location. Please enable location services.')
            this.$buefy.toast.open({
              message: 'Location access denied or unavailable.',
              type: 'is-danger'
            })
            return
          }

          // Step 2: Format timestamp (instant)
          const timestamp = currentTimestamp()

          // Step 3: Run geocoding and weather lookup concurrently with graceful degradation
          this.updateStatus('Getting address and weather...')
          let locationString = 'at unknown location'
          let weatherInfo = 'Weather unavailable'

          const lookup = walkMode
            ? { radius: WALK_CACHE_RADIUS, useSavedLocations: false }
            : { radius: GEOCODE_CACHE_RADIUS, useSavedLocations: true }
          const results = await Promise.allSettled([
            identifyPosition(pos, this.savedLocations, this.updateStatus, lookup),
            getWeather(pos)
          ])

          if (results[0].status === 'fulfilled') {
            locationString = results[0].value
          } else {
            console.error('Location lookup failed:', results[0].reason)
          }

          if (results[1].status === 'fulfilled') {
            weatherInfo = results[1].value
          } else {
            console.error('Weather lookup failed:', results[1].reason)
          }

          // Walk mode keeps the exact fix alongside whatever the address or the
          // saved label resolved to.
          if (walkMode) {
            locationString += ` ${formatCoords(pos.coords.latitude, pos.coords.longitude)}`
          }

          // Step 4: Combine and copy
          this.updateStatus('Copying to clipboard...')
          const finalStr = `[${timestamp} ${locationString}; ${weatherInfo}]`

          try {
            await clipboardWriter.writeText(finalStr)
            this.updateStatus(`Copied: ${finalStr}`)
            this.$buefy.toast.open({
              message: finalStr,
              type: 'is-success'
            })
          } catch (e) {
            console.error('Clipboard error:', e)
            this.updateStatus('Error: Could not copy to clipboard.')
            this.$buefy.toast.open({
              message: 'Error: Could not copy to clipboard.',
              type: 'is-danger'
            })
          }
        } catch (e) {
          // Never leave the clipboard write pending on an unexpected failure.
          console.error('Copy failed:', e)
          await clipboardWriter.cancel()
          this.updateStatus(`Error: ${e.message}`)
        } finally {
          this.busy = false
        }
      },
      async saveLocation() {
        if (this.savingLocation) return
        const label = this.label.trim()
        if (!label) {
          this.updateStatus('Enter a label before saving a location.')
          return
        }
        if (this.savedLocations.some(loc => loc.label.toLowerCase() === label.toLowerCase())) {
          this.updateStatus(`A location named "${label}" already exists.`)
          return
        }
        this.savingLocation = true
        this.updateStatus('Getting location...')
        try {
          const pos = await getPosition(PRECISE_POSITION_OPTIONS)
          this.savedLocations.push({
            label,
            coords: { lat: pos.coords.latitude, lon: pos.coords.longitude }
          })
          this.saveToStore()
          this.label = ''
          this.updateStatus(`Location "${label}" saved.`)
        } catch (e) {
          console.error('Geolocation error:', e)
          this.updateStatus('Error: Could not get location to save it.')
        } finally {
          this.savingLocation = false
        }
      },
      removeLocation(idx) {
        const [removed] = this.savedLocations.splice(idx, 1)
        this.saveToStore()
        this.updateStatus(removed ? `Location "${removed.label}" removed.` : 'Location removed.')
      },
      exportLocations() {
        const blob = new Blob([JSON.stringify(this.savedLocations, null, 2)], {type: 'application/json'})
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = 'locations.json'
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        // Revoking synchronously can cancel the download in some browsers.
        setTimeout(() => URL.revokeObjectURL(url), 1000)
        this.updateStatus(`Exported ${this.savedLocations.length} locations.`)
      },
      triggerImport() {
        this.$refs.importFile.click()
      },
      handleImport(e) {
        const file = e.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onerror = () => {
          this.updateStatus('Import failed: Could not read the file.')
        }
        reader.onload = evt => {
          let imported
          try {
            imported = JSON.parse(evt.target.result)
          } catch {
            this.updateStatus('Import failed: Not valid JSON.')
            return
          }
          if (!Array.isArray(imported)) {
            this.updateStatus('Import failed: Expected an array.')
            return
          }
          const validLocations = imported.map(normalizeLocation).filter(Boolean)
          if (validLocations.length === 0) {
            this.updateStatus('Import failed: No valid locations found.')
            return
          }
          // Merge rather than replace - an import should never silently discard
          // locations the user already had.
          const byLabel = new Map(this.savedLocations.map(loc => [loc.label, loc]))
          let added = 0
          let updated = 0
          for (const loc of validLocations) {
            if (byLabel.has(loc.label)) updated++
            else added++
            byLabel.set(loc.label, loc)
          }
          this.savedLocations = [...byLabel.values()]
          this.saveToStore()
          const skipped = imported.length - validLocations.length
          const parts = [`${added} added`, `${updated} updated`]
          if (skipped > 0) parts.push(`${skipped} invalid skipped`)
          this.updateStatus(`Import complete: ${parts.join(', ')}.`)
        }
        reader.readAsText(file)
        e.target.value = ''
      },
      async checkForUpdates() {
        if (this.checkingUpdate) return
        this.checkingUpdate = true
        this.updateStatus('Checking for updates...')

        try {
          if (!('serviceWorker' in navigator)) {
            this.updateStatus('Service workers are not supported in this browser.')
            return
          }

          const registration = await navigator.serviceWorker.getRegistration()
          if (!registration) {
            this.updateStatus('No service worker registered.')
            return
          }

          await registration.update()

          const pending = registration.waiting || registration.installing
          if (!pending) {
            this.updateStatus('App is up to date.')
            setTimeout(() => {
              if (this.status === 'App is up to date.') this.updateStatus(READY_STATUS)
            }, 3000)
            return
          }

          this.updateStatus('Update found, installing...')
          await whenInstalled(pending)
          this.updateStatus('Update ready, reloading...')
          // The controllerchange listener below reloads once it takes over.
          armUpdateReload()
          pending.postMessage({ type: 'SKIP_WAITING' })
          setTimeout(() => {
            if (this.status === 'Update ready, reloading...')
              this.updateStatus('Update installed. Reload the page to use it.')
          }, 5000)
        } catch (error) {
          console.error('Update check failed:', error)
          this.updateStatus('Update check failed. Please try again.')
        } finally {
          this.checkingUpdate = false
        }
      }
    }
  })
  app.mount('#app')
  </script>
  <script>
  let updateRequested = false
  function armUpdateReload() {
    updateRequested = true
  }

  if ('serviceWorker' in navigator) {
    // Reload only when a worker replaces the one that was already controlling
    // this page, or when the user asked for the update themselves. On a first
    // visit claim() would otherwise trigger a pointless reload.
    const hadController = !!navigator.serviceWorker.controller
    let reloading = false
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController && !updateRequested) return
      if (reloading) return
      reloading = true
      window.location.reload()
    })
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
  </script>
</body>
</html>
